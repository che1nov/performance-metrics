spring.application.name=performance-metrics
server.port=8082
server.address=0.0.0.0
server.shutdown=graceful
spring.mvc.async.request-timeout=30s
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=performance-metrics
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s,10s
lab.platform-threads=16
